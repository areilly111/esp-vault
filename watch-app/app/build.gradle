plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.espvault.watch'
    compileSdk 34

    defaultConfig {
        applicationId "com.espvault.watch"
        minSdk 30
        targetSdk 34
        versionCode 6
        versionName "1.5.4"
    }

    // All APKs are signed with the persistent keystore in keystore/ (see
    // keystore.properties, git-ignored). The Gradle debug keystore lives in
    // /root/.android and is wiped on VM replacement, which caused
    // INSTALL_FAILED_UPDATE_INCOMPATIBLE ("signatures do not match") —
    // never go back to it.
    def keystorePropsFile = rootProject.file("keystore.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }
    signingConfigs {
        vault {
            storeFile rootProject.file(keystoreProps['storeFile'] ?: "keystore/espvault-watch.keystore")
            storePassword keystoreProps['storePassword']
            keyAlias keystoreProps['keyAlias'] ?: "espvault-watch"
            keyPassword keystoreProps['keyPassword']
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.vault
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.vault
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    packaging {
        resources {
            excludes += 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        }
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.14"
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.wear.compose:compose-material:1.3.1'
    implementation 'androidx.wear.compose:compose-foundation:1.3.1'
    implementation 'androidx.wear.compose:compose-navigation:1.3.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.5'
    implementation 'androidx.wear:wear-input:1.2.0'
    // Argon2id KDF for Bitwarden accounts that use it (PBKDF2 is built-in)
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
}
